<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>SA Postal Map</title>


<style>

/* =====================================================
   PAGE
   ===================================================== */

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #111;

  font-family: Arial, sans-serif;

}


/* =====================================================
   CARTE
   ===================================================== */

#map {

  display: block;

  width: 100vw;
  height: 100vh;

  /* Empêche le navigateur d'interpréter
     le doigt comme un scroll */

  touch-action: none;

  background: #fff;

}


/* =====================================================
   BOUTONS
   ===================================================== */

#ui {

  position: fixed;

  right: 12px;
  top: 12px;

  display: flex;

  gap: 8px;

  z-index: 2;

}


button {

  width: 44px;
  height: 44px;

  border: 0;

  border-radius: 10px;

  background: rgba(20,20,20,.82);

  color: #fff;

  font-size: 22px;

  box-shadow: 0 2px 8px #0005;

}


/* =====================================================
   MESSAGE
   ===================================================== */

#hint {

  position: fixed;

  left: 50%;

  bottom: 12px;

  transform: translateX(-50%);

  background: #111c;

  color: #fff;

  padding: 7px 11px;

  border-radius: 9px;

  font-size: 12px;

  z-index: 2;

  pointer-events: none;

  white-space: nowrap;

}

</style>

</head>


<body>


<!-- =====================================================
     CANVAS DE LA CARTE
     ===================================================== -->

<canvas id="map"></canvas>


<!-- =====================================================
     BOUTONS
     ===================================================== -->

<div id="ui">

  <button id="minus">−</button>

  <button id="plus">+</button>

  <button id="reset">↺</button>

  <button id="full">⛶</button>

</div>


<!-- =====================================================
     MESSAGE
     ===================================================== -->

<div id="hint">

  Glisse pour déplacer • Utilise + / − pour zoomer

</div>


<script>


/* =====================================================
   INITIALISATION
   ===================================================== */

const canvas =
  document.getElementById('map');

const ctx =
  canvas.getContext('2d');


/* =====================================================
   IMAGE DE LA CARTE
   ===================================================== */

const img =
  new Image();


/*
   Même image que celle utilisée
   par la version qui fonctionnait.
*/

img.src =
  'https://s3.amazonaws.com/appforest_uf/f1496805493887x310323889600113000/Dispatch_Map_2.1.1.png';


/* =====================================================
   VARIABLES
   ===================================================== */

let dpr =
  window.devicePixelRatio || 1;


/*
   Niveau de zoom.
*/

let scale = 1;


/*
   Position de la carte.
*/

let x = 0;
let y = 0;


/*
   Gestion du déplacement.
*/

let dragging = false;

let lx = 0;
let ly = 0;

let activePointer = null;


/* =====================================================
   REDIMENSIONNEMENT
   ===================================================== */

function resize() {

  dpr =
    window.devicePixelRatio || 1;


  canvas.width =
    innerWidth * dpr;


  canvas.height =
    innerHeight * dpr;


  canvas.style.width =
    innerWidth + 'px';


  canvas.style.height =
    innerHeight + 'px';


  draw();

}


/* =====================================================
   AFFICHAGE DE LA CARTE
   ===================================================== */

function draw() {

  /*
     Configuration de la résolution
     du canvas.
  */

  ctx.setTransform(

    dpr,
    0,
    0,
    dpr,
    0,
    0

  );


  /*
     Nettoyage.
  */

  ctx.clearRect(

    0,
    0,

    innerWidth,
    innerHeight

  );


  /*
     Si l'image n'est pas encore chargée,
     on ne dessine rien.
  */

  if (
    !img.complete ||
    !img.naturalWidth
  ) {

    return;

  }


  ctx.save();


  /*
     Déplacement de la carte.
  */

  ctx.translate(
    x,
    y
  );


  /*
     Zoom de la carte.
  */

  ctx.scale(
    scale,
    scale
  );


  /*
     Position originale de la carte.
  */

  ctx.drawImage(

    img,

    -1500,
    -4000

  );


  ctx.restore();

}


/* =====================================================
   ZOOM
   ===================================================== */

function zoomAt(

  factor,

  cx = innerWidth / 2,

  cy = innerHeight / 2

) {


  /*
     Position de la carte
     sous le point de zoom.
  */

  const worldX =
    (cx - x) / scale;


  const worldY =
    (cy - y) / scale;


  /*
     Nouveau niveau de zoom.

     Minimum : 0.25
     Maximum : 5
  */

  scale =
    Math.max(

      0.25,

      Math.min(

        5,

        scale * factor

      )

    );


  /*
     On conserve le point
     sous le centre de l'écran.
  */

  x =
    cx -
    worldX * scale;


  y =
    cy -
    worldY * scale;


  draw();

}


/* =====================================================
   RESET
   ===================================================== */

function reset() {

  scale = 1;

  x = 0;
  y = 0;

  draw();

}


/* =====================================================
   DÉPLACEMENT
   ===================================================== */

/*
   Un seul doigt / curseur à la fois.

   IMPORTANT :

   Il n'y a volontairement PAS de
   pinch-to-zoom ici.

   Le zoom se fait uniquement
   avec les boutons + et −.
*/


canvas.addEventListener(

  'pointerdown',

  function(e) {


    /*
       Si un doigt/curseur est déjà actif,
       on ignore les suivants.

       Cela empêche deux doigts de
       provoquer un comportement bizarre.
    */

    if (
      activePointer !== null
    ) {

      return;

    }


    activePointer =
      e.pointerId;


    dragging = true;


    lx =
      e.clientX;


    ly =
      e.clientY;


    /*
       Garde le contrôle du doigt
       même s'il sort légèrement
       du canvas.
    */

    canvas.setPointerCapture(
      e.pointerId
    );


  }

);


/* =====================================================
   MOUVEMENT
   ===================================================== */

canvas.addEventListener(

  'pointermove',

  function(e) {


    /*
       Ignore les autres doigts.
    */

    if (
      e.pointerId !== activePointer
    ) {

      return;

    }


    if (!dragging) {

      return;

    }


    e.preventDefault();


    /*
       Calcule le déplacement.
    */

    const dx =
      e.clientX - lx;


    const dy =
      e.clientY - ly;


    /*
       Déplace la carte.
    */

    x += dx;

    y += dy;


    /*
       Nouvelle position
       de référence.
    */

    lx =
      e.clientX;


    ly =
      e.clientY;


    /*
       Redessine.
    */

    draw();

  },

  {
    passive: false
  }

);


/* =====================================================
   FIN DU DÉPLACEMENT
   ===================================================== */

canvas.addEventListener(

  'pointerup',

  function(e) {


    if (
      e.pointerId !== activePointer
    ) {

      return;

    }


    dragging = false;

    activePointer = null;

  }

);


canvas.addEventListener(

  'pointercancel',

  function(e) {


    if (
      e.pointerId !== activePointer
    ) {

      return;

    }


    dragging = false;

    activePointer = null;

  }

);


/* =====================================================
   SOURIS — ZOOM AVEC MOLETTE
   ===================================================== */

/*
   Sur PC, la molette permet toujours
   de zoomer.

   Sur téléphone, le zoom se fait
   uniquement avec + et −.
*/

canvas.addEventListener(

  'wheel',

  function(e) {

    e.preventDefault();


    zoomAt(

      e.deltaY < 0
        ? 1.12
        : 0.89,

      e.clientX,
      e.clientY

    );

  },

  {
    passive: false
  }

);


/* =====================================================
   BOUTON +
   ===================================================== */

document
  .getElementById('plus')
  .onclick = function() {

    zoomAt(

      1.2,

      innerWidth / 2,
      innerHeight / 2

    );

  };


/* =====================================================
   BOUTON −
   ===================================================== */

document
  .getElementById('minus')
  .onclick = function() {

    zoomAt(

      0.833333,

      innerWidth / 2,
      innerHeight / 2

    );

  };


/* =====================================================
   BOUTON RESET
   ===================================================== */

document
  .getElementById('reset')
  .onclick =
    reset;


/* =====================================================
   PLEIN ÉCRAN
   ===================================================== */

document
  .getElementById('full')
  .onclick = function() {


    if (
      document.documentElement.requestFullscreen
    ) {

      document
        .documentElement
        .requestFullscreen();

    }

  };


/* =====================================================
   CHARGEMENT DE L'IMAGE
   ===================================================== */

img.onload = function() {

  draw();

};


/* =====================================================
   INITIALISATION
   ===================================================== */

addEventListener(

  'resize',

  resize

);


resize();


/* =====================================================
   CACHE LE MESSAGE
   ===================================================== */

setTimeout(

  function() {

    document
      .getElementById('hint')
      .style.display =
        'none';

  },

  5000

);

</script>

</body>

</html>
